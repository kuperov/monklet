{% extends 'layout/layout_vertical.html' %}

{% load static i18n crispy_forms_tags %}

{% block title %}{{ project.name }}{% endblock %}

{% block page_css %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'vendor/css/project.css' %}" />
{% endblock page_css %}

{% block content %}
<div class="row">
    <div class="col-xl-10">
        <div class="card">
            <div class="card-header pb-4">
            <h4>{{ project.name }}</h4>
            <h5>Project settings</h5>
            </div>
            <div class="card-body">
            {% crispy form %}
            </div>
        </div>
    </div>
</div>
{% endblock content %}
