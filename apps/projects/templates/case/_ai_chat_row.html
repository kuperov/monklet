{% load markdown_filters %}

<tr id="{{msg.id}}">
  <td>{{ forloop.counter }}.</td>
  <td>{{ msg.who }}</td>
  <td>{{ msg.text | markdown }}</td>
  <td>{{ msg.reference }}</td>
  <td>
    <div class="dropdown">
      <button type="button" class="btn p-0 dropdown-toggle hide-arrow" data-bs-toggle="dropdown">
        <i class="ri-more-2-line"></i>
      </button>
      <div class="dropdown-menu">
        <a class="dropdown-item"
          hx-get="{% url 'record-edit-line' pk=record.pk line=msg.id %}"
          hx-target="#{{ msg.id }}"
          hx-swap="outerHTML"
          >
          <i class="ri-edit-2-line me-1"></i> Edit line
        </a>
        <a class="dropdown-item text-danger"
          hx-get="{% url 'record-delete-line' pk=record.pk line=msg.id %}"
          hx-confirm="Delete line?"
          hx-target="#case-card"
          hx-swap="outerHTML"
          >
          <i class="ri-delete-bin-6-line me-1 text-danger"></i> Delete line
        </a>
      </div>
    </div>
  </td>
</tr>
