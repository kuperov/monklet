<table class="table">
  <thead class="table-light">
    <tr class="text-nowrap">
        <th>Attribute</th>
        <th>Value</th>
        <th></th>
    </tr>
  </thead>
  <tbody>
    {% for key, val in case.attributes.items %}
    <tr>
      <th>{{key}}</th>
      <td>{{val}}</td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="2">
        No attributes available
      </td>
    {% endfor %}
  </tbody>
</table>
