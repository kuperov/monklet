<div class="table-responsive text-nowrap">
  <table class="table">
    <thead class="table-light">
      <tr class="text-nowrap">
          <th>Name</th>
          <th style='width: 5%;'></th>
      </tr>
    </thead>
    <tbody>
      {% for let in project.consent_letters.all %}
      <tr>
      <td>{{ let.name }}</td>
      <td>
      <div class="dropdown">
        <button type="button" class="btn p-0 dropdown-toggle hide-arrow" data-bs-toggle="dropdown"><i class="ri-more-2-line"></i></button>
        <div class="dropdown-menu">
          <a class="dropdown-item" href="#" hx-get="{% url 'consent-letter-edit' pk=let.pk %}" hx-target="#letters-tab" hx-swap="innerHTML">
          <i class="ri-edit-line me-1"></i> Edit</a>
          <a class="dropdown-item" href="#" hx-get="{% url 'consent-letter-delete' pk=let.pk %}" hx-target="#letters-tab" hx-swap="innerHTML">
            <i class="ri-close-line me-1"></i> Remove</a>
          </div>
      </div>
      </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <div class="px-0 pt-0 d-flex justify-content-end">
    <a class="m-4 btn btn-primary" href="#" hx-get="{% url 'project-consent-letters-new' pk=project.pk %}" hx-target="#letters-tab" hx-swap="innerHTML">Add consent letter</a>
  </div>
</div>
