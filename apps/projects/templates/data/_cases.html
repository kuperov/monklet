{% load humanize %}

<table class="table">
  <thead class="table-light">
    <tr class="text-nowrap">
        <th>Name</th>
        <th>Updated</th>
        <th>Type</th>
        <th />
    </tr>
  </thead>
  <tbody>
    {% for c in project.cases.all %}
    <tr>
    <td>{{ c.name }}</td>
    <td>{{ c.updated_at | naturaltime }}</td>
    <td>{{ c.record_type }}</td>
    <td>
    <div class="dropdown">
      <button type="button" class="btn p-0 dropdown-toggle hide-arrow" data-bs-toggle="dropdown"><i class="ri-more-2-line"></i></button>
      <div class="dropdown-menu">
        <a class="dropdown-item" href="{% url 'case-delete' pk=c.pk %}">
          <i class="ri-delete-line me-1 text-danger"></i> Delete</a>
        </div>
    </div>
    </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
<div class="px-0 pt-0 d-flex justify-content-end">
  <a class="m-4 btn btn-primary" href="{% url 'project-import-chats' pk=project.pk %}">Import chats</a>
  <a class="m-4 btn btn-secondary" href="{% url 'case-upload' pk=project.pk %}">Manual upload</a>
</div>
