# Local development: db, redis, celery, postfix only. Run the web app locally (e.g. make dev).
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: monklet
      POSTGRES_USER: monklet
      POSTGRES_PASSWORD: monklet
    volumes:
      - monklet_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - monklet_redis_data:/data
    ports:
      - "6379:6379"

  postfix:
    image: boky/postfix:latest
    environment:
      ALLOW_EMPTY_SENDER_DOMAINS: "true"
      HOSTNAME: postfix
    ports:
      - "1025:587"

  celery_worker:
    build:
      context: .
    command: celery -A config.celery worker --loglevel=info --concurrency=2
    env_file:
      - ./.env
    volumes:
      - ./logs/monklet:/var/log/monklet
    environment:
      DJANGO_ENVIRONMENT: container
      DEBUG: "False"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_NAME: monklet
      DB_USER: monklet
      DB_PASSWORD: monklet
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      - db
      - redis

  celery_beat:
    build:
      context: .
    command: celery -A config.celery beat --loglevel=info
    env_file:
      - ./.env
    volumes:
      - ./logs/monklet:/var/log/monklet
    environment:
      DJANGO_ENVIRONMENT: container
      DEBUG: "False"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_NAME: monklet
      DB_USER: monklet
      DB_PASSWORD: monklet
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      - db
      - redis

volumes:
  monklet_postgres_data:
  monklet_redis_data:
